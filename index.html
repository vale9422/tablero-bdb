<div class="card"><div class="k">Saldo después (6 m)</div><div class="v">${fP(IMPS.post_med,1)}</div><div class="s">saldo mediano mensual (M)</div></div>
<div class="card gold"><div class="k">Variación del saldo</div><div class="v">+${fP(IMPS.variacion_med_pct,0)}%</div><div class="s">mediana tras activar</div></div>
<div class="card gold"><div class="k">Empresas que mejoran</div><div class="v">${fP(IMPS.pct_empresas_mejoran,1)}%</div><div class="s">aumentan su saldo promedio</div></div>
</div>
<div class="panel"><h3><span class="bar"></span>Efecto principal: saldo mediano antes vs. después</h3><div class="chartbox"><canvas id="c_imp"></canvas></div>
<div class="note">La activación canaliza los flujos operativos de la empresa hacia el banco: el saldo mediano se duplica (+${fP(IMPS.variacion_med_pct,0)}%) y el ${fP(IMPS.pct_empresas_mejoran,1)}% de las empresas incrementa su fondeo. Resultado consistente con el hallazgo central: el 91,4% del valor del área proviene del fondeo.</div></div>
<div class="panel"><h3><span class="bar"></span>Resultado complementario: comisión media (n = ${fM(IMP.n)})</h3>
<div class="cards">
<div class="card"><div class="k">Antes (6 m)</div><div class="v">${fP(IMP.pre_prom,3)}</div><div class="s">comisión media mensual (M)</div></div>
<div class="card"><div class="k">Después (6 m)</div><div class="v">${fP(IMP.post_prom,3)}</div><div class="s">incluye el mes de activación</div></div>
<div class="card"><div class="k">Variación</div><div class="v">+${fP(IMP.variacion_pct,0)}%</div><div class="s">de la media</div></div>
<div class="card"><div class="k">Empresas que mejoran</div><div class="v">${fP(IMP.pct_empresas_mejoran,1)}%</div><div class="s">concentración en pocos clientes</div></div>
</div>
<div class="chartbox sm"><canvas id="c_imp2"></canvas></div>
<div class="note">El incremento de la comisión media está concentrado en un subconjunto de clientes de alta transaccionalidad (solo el ${fP(IMP.pct_empresas_mejoran,1)}% de las empresas mejora su comisión), por lo que se interpreta como complemento del efecto sobre saldos y no como un incremento generalizado.</div>
<div class="note"><b>Lectura con cautela causal:</b> los aumentos son consistentes con un efecto positivo de la activación, pero no constituyen una estimación causal —las empresas que se vinculan pueden estar en fase de expansión (endogeneidad). Ver reflexión crítica en el informe.</div></div>`;

V.kpis=()=>`<div class="head"><div class="crumb">Objetivo 5</div><h2>Indicadores (KPIs)</h2><p>Seis indicadores que sustentan el análisis, cada uno asociado a una dimensión del objetivo general.</p></div>
${[['ROA de Depósitos','Comisiones / Saldo promedio captado','Rentabilidad por comisión de cada peso de saldo. Adapta el ROA tradicional al negocio.'],
['Margen de valor','Comisiones + (Saldo × FTP/12 × meses)','Integra comisión y valor del fondeo. El FTP de 8,5% es un parámetro de referencia, no una tasa observada; el hallazgo es robusto para cualquier FTP > 0,8%.'],
['Índice de Fondeo Vital','Saldo promedio / Flujo de entrada','Proporción del flujo que permanece como saldo. Mide reciprocidad estable.'],
['Velocidad Transaccional','Flujo total / Saldo promedio','Rotación del saldo (adaptación de MV=PQ de Fisher).'],
['Return on Relationship','Comisiones / Flujo total','Comisión efectiva por peso movilizado (tarifa relacional implícita).'],
['Tasa de crecimiento de negocios (variación anual)','(Negocios t+1 / Negocios t) − 1','Ritmo de captación de nuevos negocios entre años consecutivos; con dos periodos se calcula como variación simple, no compuesta.']]
.map(k=>`<div class="kpi-def"><div class="nm">${k[0]}</div><div class="fx">${k[1]}</div><div class="ds">${k[2]}</div></div>`).join('')}`;

V.limpieza=()=>`<div class="head"><div class="crumb">Segunda parte</div><h2>Limpieza de datos</h2><p>Documentación del proceso de depuración. Los datos corruptos se identificaron y excluyeron a nivel de celda, sin descartar empresas completas.</p></div>
<div class="cards">
<div class="card"><div class="k">Filas duplicadas</div><div class="v">${fM(L.filas_dup)}</div><div class="s">eliminadas</div></div>
<div class="card"><div class="k">Celdas corruptas</div><div class="v">${fM(L.total_corruptas)}</div><div class="s"><span class="flag">${fP(L.pct_corrupto,2)}% del total</span></div></div>
<div class="card"><div class="k">Celdas válidas</div><div class="v">${fM(L.total_validas)}</div><div class="s"><span class="flag ok">conservadas</span></div></div>
<div class="card"><div class="k">Umbral corrupción</div><div class="v">10¹³</div><div class="s">COP / empresa-mes</div></div>
</div>
<div class="panel"><h3><span class="bar"></span>Celdas corruptas por base</h3><div class="sub">Valores &gt; 10¹³ COP, imposibles económicamente</div>
<table><thead><tr><th>Base</th><th>Celdas válidas</th><th>Celdas corruptas</th><th>Empresas afectadas</th></tr></thead><tbody>
${Object.entries(L.por_hoja).map(([k,v])=>`<tr><td>${k}</td><td>${fM(v.n_validas)}</td><td>${fM(v.n_corruptas)}</td><td>${fM(v.empresas_afectadas)}</td></tr>`).join('')}
</tbody></table>
<div class="note">El criterio de limpieza <b>a nivel de celda</b> (anular solo el valor corrupto y promediar los meses válidos) permitió conservar ${fM(T.n_empresas_analisis)} de ${fM(T.n_empresas_raw)} empresas, en lugar de descartar empresas completas.</div></div>
<div class="grid2">
<div class="panel"><h3><span class="bar"></span>Datos corruptos por segmento</h3><div class="sub">Concentración de celdas erróneas</div><div class="chartbox sm"><canvas id="c_corrseg"></canvas></div>
<div class="note">El <b>${fP(CR.pct_publico_en_oficial,1)}%</b> de los datos corruptos del segmento Oficial corresponde a entidades públicas (municipios, alcaldías, ESE). Posible origen: proceso de carga de cuentas oficiales.</div></div>
<div class="panel"><h3><span class="bar"></span>Empresas más afectadas</h3><div class="sub">Mayor número de celdas corruptas</div>
<table><thead><tr><th>Empresa</th><th>Segmento</th><th>Celdas</th></tr></thead><tbody>
${CR.top_empresas.slice(0,10).map(e=>`<tr><td>${e.nombre}</td><td><span class="tag ${e.segmento.slice(0,4).toLowerCase()}">${e.segmento}</span></td><td>${e.celdas}</td></tr>`).join('')}
</tbody></table></div></div>
<div class="panel"><h3><span class="bar"></span>Ejemplos de valores corruptos</h3><div class="sub">Saldos de magnitud imposible (decenas de miles de billones COP en un solo mes)</div>
<table><thead><tr><th>Empresa</th><th>Segmento</th><th>Base</th><th>Mes</th><th>Valor (COP)</th></tr></thead><tbody>
${CR.ejemplos.slice(0,12).map(e=>`<tr><td>${e.nombre}</td><td><span class="tag ${e.segmento.slice(0,4).toLowerCase()}">${e.segmento}</span></td><td>${e.base}</td><td>${e.mes}</td><td>${e.valor.toExponential(2)}</td></tr>`).join('')}
</tbody></table>
<div class="note">El detalle completo de las <b>${fM(CR.total)} celdas corruptas</b> se entrega como anexo en Excel independiente, para su rastreo y depuración por el área.</div></div>`;

V.individual=()=>`<div class="head"><div class="crumb">Objetivo 4</div><h2>Comparación a nivel individual</h2><p>Perfiles diferenciados de aporte de valor empresa por empresa. Confirma la división de roles: unos clientes aportan fondeo (saldo), otros comisión (transaccionalidad).</p></div>
<div class="grid2">
<div class="panel"><h3><span class="bar"></span>Mayores generadores de valor total</h3><div class="sub">Comisión + valor del fondeo · dominado por aportantes de fondeo</div>
<table><thead><tr><th>Empresa</th><th>Seg.</th><th>Valor (B)</th><th>Saldo (B)</th><th>Comis. (M)</th></tr></thead><tbody>
${CI.top_valor.slice(0,8).map(c=>`<tr><td>${c.nombre}</td><td><span class="tag ${c.segmento.slice(0,4).toLowerCase()}">${c.segmento.slice(0,4)}</span></td><td>$${fB(c.valor)}</td><td>$${fB(c.saldo)}</td><td>${fM(c.comisiones)}</td></tr>`).join('')}
</tbody></table></div>
<div class="panel"><h3><span class="bar"></span>Mayores generadores por comisión</h3><div class="sub">Alta transaccionalidad · aportantes de comisión</div>
<table><thead><tr><th>Empresa</th><th>Seg.</th><th>Comis. (M)</th><th>Saldo (M)</th><th>RoR</th><th>Velocidad</th></tr></thead><tbody>
${CI.top_comisiones.slice(0,8).map(c=>`<tr><td>${c.nombre}</td><td><span class="tag ${c.segmento.slice(0,4).toLowerCase()}">${c.segmento.slice(0,4)}</span></td><td>${fM(c.comisiones)}</td><td>${fM(c.saldo)}</td><td>${fP(c.ror*100,4)}%</td><td>${fM(c.vel)}</td></tr>`).join('')}
</tbody></table>
<div class="note" style="margin-top:12px">Para este perfil, el <b>ROA de Depósitos no aplica</b>: retienen muy poco saldo. Su valor está en la transaccionalidad, medida por el <b>RoR</b> (comisión/flujo) y la <b>velocidad</b> (rotación del saldo).</div></div></div>
<div class="panel"><h3><span class="bar"></span>Mapa de perfiles: saldo vs. comisión</h3><div class="sub">Cada punto es una empresa destacada. Eje X: saldo (fondeo); Eje Y: comisiones</div><div class="chartbox"><canvas id="c_scatter"></canvas></div>
<div class="note">Los dos arquetipos son claros: <b>aportantes de fondeo</b> (alto saldo, baja comisión — típicamente Oficial) y <b>aportantes de comisión</b> (alta comisión, saldo bajo — Corporativo/Empresarial). La rentabilidad del área no se juzga con una sola métrica.</div></div>`;

const donaLabels={id:'donaLabels',afterDatasetsDraw(ch){const{ctx}=ch;const meta=ch.getDatasetMeta(0);const data=ch.data.datasets[0].data;const total=data.reduce((a,b)=>a+b,0);meta.data.forEach((arc,i)=>{const p=data[i]/total*100;if(p<2.5)return;const pos=arc.tooltipPosition();ctx.save();ctx.fillStyle='#fff';ctx.font='600 12px "IBM Plex Sans",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.toFixed(1).replace('.',',')+'%',pos.x,pos.y);ctx.restore();});}};
function draw(v){
 if(v==='individual'){
  const pts=(arr,col)=>arr.map(c=>({x:c.saldo/1e6,y:c.comisiones,nombre:c.nombre}));
  mk('c_scatter',{type:'scatter',data:{datasets:[
   {label:'Top por valor (fondeo)',data:pts(CI.top_valor),backgroundColor:'#C8A04B',pointRadius:7},
   {label:'Top por comisión',data:pts(CI.top_comisiones),backgroundColor:'#0A6BD8',pointRadius:7}]},
   options:{maintainAspectRatio:false,scales:{x:{title:{display:true,text:'Saldo promedio (billones COP)'}},y:{title:{display:true,text:'Comisiones acumuladas (millones COP, escala logarítmica)'},type:'logarithmic'}},
   plugins:{tooltip:{callbacks:{label:c=>c.raw.nombre+': saldo $'+fP(c.raw.x,2)+'B, com '+fM(c.raw.y)+'M'}}}}});
 }
 if(v==='limpieza'){
  const segs=['Corporativo','Empresarial','Oficial'];
  mk('c_corrseg',{type:'bar',data:{labels:segs,datasets:[{label:'Celdas corruptas',data:segs.map(s=>CR.por_segmento[s]||0),backgroundColor:segs.map(s=>SC[s])}]},
   options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+fM(c.parsed.y)+' celdas'}}},scales:{y:{title:{display:true,text:'Número de celdas corruptas'}}}}});
 }
 if(v==='resumen'){
  mk('c_val',{type:'bar',data:{labels:SEG,datasets:[
   {label:'Comisiones',data:SEG.map(s=>S[s].comisiones_tot/1e6),backgroundColor:'#0A6BD8'},
   {label:'Valor del fondeo',data:SEG.map(s=>S[s].valor_fondeo/1e6),backgroundColor:'#C8A04B'}]},
   options:{maintainAspectRatio:false,scales:{x:{stacked:true},y:{stacked:true,title:{display:true,text:'Valor generado (billones COP)'}}},plugins:{tooltip:{callbacks:{label:c=>` ${c.dataset.label}: $${fP(c.parsed.y,2)} B`}}}}});
  mk('c_dona',{type:'doughnut',data:{labels:SEG,datasets:[{data:SEG.map(s=>S[s].saldo_prom_tot/1e6),backgroundColor:SEG.map(s=>SC[s]),borderColor:'#121C2E',borderWidth:2}]},
   options:{maintainAspectRatio:false,cutout:'58%',plugins:{tooltip:{callbacks:{label:c=>` ${c.label}: $${fP(c.parsed,2)} billones (${fP(100*c.parsed/SEG.reduce((a,s)=>a+S[s].saldo_prom_tot/1e6,0),1)}%)`}}},},plugins:[donaLabels]});
  mk('c_evol',{type:'line',data:{labels:M.meses,datasets:SEG.filter(s=>M.comisiones_entrada[s]).map(s=>({label:s,data:M.comisiones_entrada[s],borderColor:SC[s],backgroundColor:'transparent',tension:.3,pointRadius:0,borderWidth:2}))},
   options:{maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ${fM(c.parsed.y)} M COP`}}},scales:{x:{ticks:{maxTicksLimit:12}},y:{title:{display:true,text:'Comisiones de entrada mensuales (millones COP)'}}}}});
 }
 if(v==='rentab'){
  mk('c_roa',{type:'bar',data:{labels:SEG,datasets:[{label:'ROA Dep. (%)',data:SEG.map(s=>S[s].roa_depositos*100),backgroundColor:SEG.map(s=>SC[s])}]},
   options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${fP(c.parsed.y,2)}%`}}},scales:{y:{title:{display:true,text:'ROA de Depósitos acumulado, 29 meses (%)'}}}}});
  mk('c_vel',{type:'bar',data:{labels:SEG,datasets:[{label:'Velocidad',data:SEG.map(s=>S[s].velocidad),backgroundColor:SEG.map(s=>SC[s])}]},
   options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${fP(c.parsed.y,1)} rotaciones`}}},scales:{y:{title:{display:true,text:'Rotaciones del saldo en el periodo (veces)'}}}}});
 }
 if(v==='recipro'){
  mk('c_ifv',{type:'bar',data:{labels:SEG,datasets:[{label:'IFV',data:SEG.map(s=>S[s].ifv),backgroundColor:SEG.map(s=>SC[s])}]},
   options:{maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` IFV: ${fP(c.parsed.x,4)}`}}},scales:{x:{title:{display:true,text:'IFV = saldo promedio / flujo de entrada (proporción)'}}}}});
  mk('c_saldo',{type:'line',data:{labels:M.meses,datasets:SEG.filter(s=>M.saldo_cc[s]).map(s=>({label:s,data:M.saldo_cc[s].map(x=>x/1e6),borderColor:SC[s],backgroundColor:'transparent',tension:.3,pointRadius:0,borderWidth:2}))},
   options:{maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{tooltip:{callbacks:{label:c=>` ${c.dataset.label}: $${fP(c.parsed.y,2)} billones`}}},scales:{x:{ticks:{maxTicksLimit:10}},y:{title:{display:true,text:'Saldo en cuentas corrientes (billones COP)'}}}}});
 }
 if(v==='negocios'){
  mk('c_cos',{type:'bar',data:{labels:Object.keys(R.cosecha_anio).filter(a=>a>='2023').map(a=>a==='2025'?'2025 (a mayo)':a),datasets:[{label:'Negocios',data:Object.entries(R.cosecha_anio).filter(([a])=>a>='2023').map(([,v])=>v),backgroundColor:'#0A6BD8'}]},
   options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${fM(c.parsed.y)} negocios`}}},scales:{y:{title:{display:true,text:'Número de negocios ganados'}}}}});
  const pr=Object.entries(R.cosecha_producto).slice(0,8);
  mk('c_prod',{type:'bar',data:{labels:pr.map(p=>p[0]),datasets:[{data:pr.map(p=>p[1]),backgroundColor:'#C8A04B'}]},
   options:{maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${fM(c.parsed.x)} negocios`}}},scales:{x:{title:{display:true,text:'Número de negocios ganados'}}}}});
 }
 if(v==='impacto'){
  mk('c_imp',{type:'bar',data:{labels:['Antes (6m)','Después (6m)'],datasets:[{data:[IMPS.pre_med,IMPS.post_med],backgroundColor:['#595959','#2DD4A7']}]},
   options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${fP(c.parsed.y,1)} M COP`}}},scales:{y:{title:{display:true,text:'Saldo mediano mensual (millones COP)'}}}}});
  mk('c_imp2',{type:'bar',data:{labels:['Antes (6m)','Después (6m)'],datasets:[{data:[IMP.pre_prom,IMP.post_prom],backgroundColor:['#595959','#5B9BE8']}]},
   options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${fP(c.parsed.y,3)} M COP`}}},scales:{y:{title:{display:true,text:'Comisión media mensual (millones COP)'}}}}});
 }
}
function safeDraw(v,tries){tries=tries||0;if(typeof Chart==='undefined'){if(tries<40)return setTimeout(()=>safeDraw(v,tries+1),100);return;}setChartDefaults();try{draw(v);}catch(e){console.warn(e);}}
function show(v){document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.dataset.v===v));
 try{document.getElementById('main').innerHTML='<div class="view active">'+V[v]()+'</div>';}catch(e){document.getElementById('main').innerHTML='<div class="head"><h2>Error</h2><p>'+e.message+'</p></div>';}
 safeDraw(v);}
document.querySelectorAll('.nav a').forEach(a=>a.addEventListener('click',()=>show(a.dataset.v)));
function init(){show('resumen');}if(document.readyState!=='loading')init();else document.addEventListener('DOMContentLoaded',init);
</script></body></html>
